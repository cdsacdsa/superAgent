[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent"
version = "1.0.0"
description = "Autonomous ITIL L2/L3 support agent on Azure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "openai>=1.40",
  "anthropic>=1.0",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.17",
  "azure-cosmos>=4.7",
  "azure-servicebus>=7.12",
  "azure-mgmt-compute>=33.0",
  "azure-mgmt-network>=27.0",
  "azure-monitor-opentelemetry>=1.6",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
superagent = ["api/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
